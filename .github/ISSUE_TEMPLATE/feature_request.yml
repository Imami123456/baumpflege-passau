name: ✨ Feature Request
description: Suggest an enhancement or new feature for the website
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the user experience or add a new arborism capability?
  - type: textarea
    id: problem
    attributes:
      label: Problem or Opportunity
      description: Is your feature request related to a specific challenge?
      placeholder: Homeowners often ask about...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see implemented.
      placeholder: Add an interactive...
    validations:
      required: true
